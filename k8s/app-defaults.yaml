apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-defaults
spec:
  template:
    spec:
      automountServiceAccountToken: false
      containers:
        - name: app
          # shortcut: images are local to one Minikube node; use registry tags for shared deployments.
          imagePullPolicy: Never
          envFrom:
            - configMapRef:
                name: crm-config
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              memory: 768Mi
          startupProbe:
            httpGet:
              path: /health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /health/liveness
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
