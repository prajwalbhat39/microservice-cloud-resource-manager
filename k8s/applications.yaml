apiVersion: apps/v1
kind: Deployment
metadata:
  name: quota
  labels:
    crm/database: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: quota
  template:
    metadata:
      labels:
        app: quota
    spec:
      containers:
        - name: app
          image: crm/quota:local
          ports:
            - name: http
              containerPort: 8081
          env:
            - name: SERVER_PORT
              value: "8081"
            - name: DB_NAME
              value: quota_db
            - name: DB_USER
              value: quota_user
---
apiVersion: v1
kind: Service
metadata:
  name: quota
spec:
  selector:
    app: quota
  ports:
    - name: http
      port: 8081
      targetPort: http
---
