apiVersion: apps/v1
kind: Deployment
metadata:
  name: database-apps
spec:
  template:
    spec:
      initContainers:
        - name: wait-for-postgres
          image: postgres:16-alpine
          command:
            - sh
            - -ec
            - until pg_isready -h postgres -U postgres -d postgres; do sleep 2; done
      containers:
        - name: app
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: crm-db
                  key: DB_PASSWORD
