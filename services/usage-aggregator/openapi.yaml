openapi: 3.1.0
info:
  title: CRM Usage Aggregator
  version: v1
servers:
- url: /
tags:
- description: Monitor and interact
  externalDocs:
    description: Spring Boot Actuator Web API Documentation
    url: https://docs.spring.io/spring-boot/docs/current/actuator-api/html/
  name: Actuator
paths:
  /api/v1/usage/{tenantId}:
    get:
      operationId: read
      parameters:
      - in: path
        name: tenantId
        required: true
        schema:
          type: string
          maxLength: 64
          minLength: 0
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Usage"
          description: "Unavailable sections omitted and marked false, including total\
            \ outage"
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "VALIDATION_FAILED: invalid tenantId"
      summary: "Compose quota, active resources and current UTC month's cost"
      tags:
      - usage-controller
  /health:
    get:
      operationId: health
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
            application/vnd.spring-boot.actuator.v2+json:
              schema:
                type: object
            application/vnd.spring-boot.actuator.v3+json:
              schema:
                type: object
          description: OK
        "503":
          content:
            application/json:
              schema:
                type: object
            application/vnd.spring-boot.actuator.v2+json:
              schema:
                type: object
            application/vnd.spring-boot.actuator.v3+json:
              schema:
                type: object
          description: Service or its database is unavailable
      summary: Actuator web endpoint 'health'
      tags:
      - Actuator
components:
  schemas:
    Availability:
      type: object
      properties:
        billing:
          type: boolean
        quota:
          type: boolean
        resources:
          type: boolean
    JsonNode: {}
    ProblemDetail:
      type: object
      additionalProperties: true
      properties:
        code:
          type: string
        correlationId:
          type: string
        detail:
          type:
          - string
          - "null"
        instance:
          type:
          - string
          - "null"
          format: uri
        status:
          type: integer
          format: int32
        timestamp:
          type: string
          format: date-time
        title:
          type:
          - string
          - "null"
        type:
          type: string
          format: uri
      required:
      - code
      - correlationId
      - detail
      - instance
      - status
      - timestamp
      - title
      - type
    Usage:
      type: object
      properties:
        availability:
          $ref: "#/components/schemas/Availability"
        cost:
          $ref: "#/components/schemas/JsonNode"
        quota:
          $ref: "#/components/schemas/JsonNode"
        resources:
          $ref: "#/components/schemas/JsonNode"
