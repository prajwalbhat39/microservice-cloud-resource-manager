server:
  port: ${SERVER_PORT:8083}

spring:
  application:
    name: billing-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:billing_db}
    username: ${DB_USER:billing_user}
    password: ${DB_PASSWORD:changeme}
    hikari:
      minimum-idle: 0
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:2000}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

billing:
  default-cpu-rate-per-hour: ${DEFAULT_CPU_RATE:0.12}
  failure-rate: ${BILLING_FAILURE_RATE:0}

management:
  endpoints:
    web:
      base-path: /
      exposure:
        include: health
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true


logging:
  structured:
    format:
      console: ecs
  level:
    root: ${LOG_LEVEL:INFO}
