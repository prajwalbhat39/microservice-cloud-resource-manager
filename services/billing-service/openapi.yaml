openapi: 3.1.0
info:
  title: OpenAPI definition
  version: v0
servers:
- url: http://127.0.0.1:8083
  description: Generated server url
paths:
  /api/v1/billing/meters:
    post:
      tags:
      - billing-controller
      operationId: startMeter
      parameters:
      - name: X-Simulate-Failure
        in: header
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartMeterRequest"
        required: true
      responses:
        "201":
          description: Meter created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/MeterResponse"
        "200":
          description: Existing meter replayed
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/MeterResponse"
        "400":
          description: Invalid input
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/MeterResponse"
        "409":
          description: Meter start was cancelled
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/MeterResponse"
        "503":
          description: Billing unavailable or simulated failure
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/MeterResponse"
  /api/v1/billing/meters/{resourceId}/stop:
    post:
      tags:
      - billing-controller
      operationId: stopMeter
      parameters:
      - name: resourceId
        in: path
        required: true
        schema:
          type: string
          maxLength: 64
          minLength: 0
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/MeterResponse"
  /api/v1/billing/tenants/{tenantId}/cost:
    get:
      tags:
      - billing-controller
      operationId: getTenantCost
      parameters:
      - name: tenantId
        in: path
        required: true
        schema:
          type: string
          maxLength: 64
          minLength: 0
      - name: period
        in: query
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/TenantCostResponse"
  /api/v1/billing/meters/{resourceId}:
    get:
      tags:
      - billing-controller
      operationId: getMeter
      parameters:
      - name: resourceId
        in: path
        required: true
        schema:
          type: string
          maxLength: 64
          minLength: 0
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/MeterResponse"
components:
  schemas:
    StartMeterRequest:
      type: object
      properties:
        resourceId:
          type: string
          maxLength: 64
          minLength: 0
        tenantId:
          type: string
          maxLength: 64
          minLength: 0
        cpu:
          type: integer
          format: int32
          minimum: 1
        ratePerCpuHour:
          type: number
          minimum: 0.0
      required:
      - resourceId
      - tenantId
    MeterResponse:
      type: object
      properties:
        meterId:
          type: string
          format: uuid
        resourceId:
          type: string
        tenantId:
          type: string
        cpu:
          type: integer
          format: int32
        ratePerCpuHour:
          type: number
        state:
          type: string
          enum:
          - ACTIVE
          - STOPPED
        startedAt:
          type: string
          format: date-time
        stoppedAt:
          type: string
          format: date-time
        currentCost:
          type: number
    TenantCostResponse:
      type: object
      properties:
        tenantId:
          type: string
        period:
          type: string
        totalCost:
          type: number
