# =============================================================================
# Cloud Resource Manager — full-system container deployment.
#
#   docker compose up --build
#
# Brings up one PostgreSQL (with all five databases created on first boot) plus
# the seven microservices, wired to each other by service name over the Compose
# network. Config is supplied entirely through environment variables; no secrets
# are baked into images.
#
# Task 2 (Vinayak): readiness-gated startup and persistent database storage.
# =============================================================================

x-app: &app
  restart: unless-stopped
  networks:
    - crm
  environment: &app-env
    JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--Xmx256m}
  healthcheck:
    test: ["CMD-SHELL", "curl --fail --silent --show-error --max-time 3 http://127.0.0.1:$${SERVER_PORT}/health"]
    interval: 10s
    timeout: 5s
    start_period: 90s
    retries: 12

x-database-env: &database-env
  <<: *app-env
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_PASSWORD: ${DB_PASSWORD:-changeme}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    networks:
      - crm
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-changeme}
    volumes:
      # The wrapper passes DB_PASSWORD safely to the existing psql scripts.
      - ./scripts/db/init-compose.sh:/docker-entrypoint-initdb.d/01-init.sh:ro
      - ./scripts/db/setup-u1.sql:/setup/setup-u1.sql:ro
      - ./scripts/db/setup-u2-u4.sql:/setup/setup-u2-u4.sql:ro
      - pgdata:/var/lib/postgresql/data
    # Mapped to 5433 on the host to avoid clashing with a native PostgreSQL on 5432.
    ports:
      - "5433:5432"
    healthcheck:
      # TCP is unavailable on the temporary init server, so this only passes
      # after all five databases and roles have been initialized.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 20

  quota:
    <<: *app
    build: ./services/quota
    environment:
      <<: *database-env
      SERVER_PORT: "8081"
      DB_NAME: quota_db
      DB_USER: quota_user
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy

  resource:
    <<: *app
    build: ./services/resource
    environment:
      <<: *database-env
      SERVER_PORT: "8082"
      DB_NAME: resource_db
      DB_USER: resource_user
      QUOTA_SERVICE_URL: http://quota:8081
      PROVIDER_SERVICE_URL: http://provider:8085
      BILLING_SERVICE_URL: http://billing:8083
      NOTIFICATION_SERVICE_URL: http://notification:8084
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
      quota:
        condition: service_healthy
      provider:
        condition: service_healthy
      billing:
        condition: service_healthy
      notification:
        condition: service_healthy

  billing:
    <<: *app
    build: ./services/billing-service
    environment:
      <<: *database-env
      SERVER_PORT: "8083"
      DB_NAME: billing_db
      DB_USER: billing_user
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy

  notification:
    <<: *app
    build: ./services/notification-service
    environment:
      <<: *database-env
      SERVER_PORT: "8084"
      DB_NAME: notification_db
      DB_USER: notification_user
    ports:
      - "8084:8084"
    depends_on:
      postgres:
        condition: service_healthy

  provider:
    <<: *app
    build: ./services/provider
    environment:
      <<: *database-env
      SERVER_PORT: "8085"
      DB_NAME: provider_db
      DB_USER: provider_user
      # Demo-safe: deterministic provider (no random failures), shorter delay.
      PROVIDER_FAILURE_RATE: "0"
      PROVIDER_DELAY_MIN_MS: "800"
      PROVIDER_DELAY_MAX_MS: "1500"
    ports:
      - "8085:8085"
    depends_on:
      postgres:
        condition: service_healthy

  usage-aggregator:
    <<: *app
    build: ./services/usage-aggregator
    environment:
      <<: *app-env
      SERVER_PORT: "8086"
      QUOTA_SERVICE_URL: http://quota:8081
      BILLING_SERVICE_URL: http://billing:8083
      RESOURCE_SERVICE_URL: http://resource:8082
    ports:
      - "8086:8086"
    depends_on:
      quota:
        condition: service_healthy
      billing:
        condition: service_healthy
      resource:
        condition: service_healthy

  expiry-worker:
    <<: *app
    build: ./services/expiry-worker
    environment:
      <<: *app-env
      SERVER_PORT: "8087"
      RESOURCE_SERVICE_URL: http://resource:8082
      # Off by default so it does not terminate demo resources mid-flow.
      EXPIRY_ENABLED: "false"
    ports:
      - "8087:8087"
    depends_on:
      resource:
        condition: service_healthy

networks:
  crm:
    driver: bridge

volumes:
  pgdata:
